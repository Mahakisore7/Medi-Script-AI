[project]
name = "rx-recognition"
version = "0.1.0"
description = "Handwritten medical prescription recognition pipeline"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.14.0",
    "albumentations>=2.0.8",
    "datasets>=5.0.0",
    "evaluate>=0.4.6",
    "huggingface-hub>=1.24.0",
    "jiwer>=4.0.0",
    "numpy>=2.5.1",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "protobuf>=7.35.1",
    "pytesseract>=0.3.13",
    "rapidfuzz>=3.14.5",
    "sentencepiece>=0.2.2",
    "tiktoken>=0.13.0",
    "transformers>=5.14.1",
    "ultralytics>=8.4.105",
    "wandb>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]
