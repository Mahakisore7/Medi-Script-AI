[project]
name = "medi-script-ai"
version = "1.0.0"
description = "Hybrid deep-learning pipeline that digitises handwritten medical prescriptions into structured records."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Mahakisore M" },
    { name = "Yashwanth B" },
]
dependencies = [
    "numpy",
    "opencv-python-headless",
    "pillow",
    "rapidfuzz>=3.0",
    "scikit-learn",
    "pandas",
    "python-dotenv",
    "pyyaml",
]

[project.optional-dependencies]
ml = [
    "torch",
    "torchvision",
    "ultralytics>=8.3",
    "transformers>=4.40",
    "easyocr>=1.7.2",
    "albumentations>=2.0",
    "evaluate",
    "jiwer",
    "accelerate",
    "sentencepiece",
]
llm = ["google-genai>=1.0"]
api = ["fastapi", "uvicorn", "python-multipart"]
viz = ["matplotlib"]
dev = ["pytest", "pytest-cov", "ruff", "pre-commit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mediscript"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
